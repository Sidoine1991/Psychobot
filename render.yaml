services:
  - type: web
    name: psychobot-api
    runtime: node
    plan: standard
    startCommand: node index.js
    buildCommand: npm install
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SESSION_DATA
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_SERVER_URL
        sync: false
      - key: DATABASE_URL
        sync: false
    disk:
      name: psychobot-session
      mountPath: /opt/render/project/src/session
      sizeGB: 1
