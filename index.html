<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psycho bot | WhatsApp Pairing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5865F2;
            --secondary: #eb459e;
            --bg: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(235, 69, 158, 0.15) 0%, transparent 40%);
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        p {
            color: var(--text-dim);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-group-title {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-nav {
            display: inline-block;
            padding: 10px 16px;
            background: rgba(88, 101, 242, 0.2);
            color: var(--primary);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(88, 101, 242, 0.3);
            cursor: pointer;
        }

        .btn-nav:hover {
            background: rgba(88, 101, 242, 0.4);
            border-color: rgba(88, 101, 242, 0.6);
            transform: translateY(-2px);
        }

        .dev-card {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dev-photo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(88, 101, 242, 0.5);
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .dev-info {
            text-align: left;
            flex: 1;
        }

        .dev-title {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .dev-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .btn-contact {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(235, 69, 158, 0.2);
            color: var(--secondary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(235, 69, 158, 0.4);
            transition: all 0.3s ease;
        }

        .btn-contact:hover {
            background: rgba(235, 69, 158, 0.4);
            border-color: rgba(235, 69, 158, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(235, 69, 158, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>Psycho bot</h1>
        <p>Unlock the full power of your WhatsApp. Automate reactions, extract view-once media, and respond with AI effortlessly.</p>

        <!-- Developer Contact Card -->
        <div class="dev-card">
            <img src="/profile.png" alt="Developer" class="dev-photo">
            <div class="dev-info">
                <div class="dev-title">👨‍💻 Développeur</div>
                <div class="dev-name">Sidoine</div>
                <a href="https://wa.me/2290196911346" class="btn-contact" target="_blank">💬 WhatsApp</a>
            </div>
        </div>

        <div>
            <a href="/pair" class="btn">Pair with Code</a>
            <a href="/qr" class="btn" style="background: linear-gradient(45deg, #eb459e, #5865F2); margin-left: 10px;">Scan QR Code</a>
        </div>

        <!-- Navigation to PsychoBot Pages -->
        <div class="btn-group">
            <div class="btn-group-title">📱 PsychoBot Career-Ops</div>
            <div class="nav-buttons">
                <a href="/" class="btn-nav">📊 Dashboard</a>
                <a href="/?tab=jobs" class="btn-nav">🔍 Job Search</a>
                <a href="/?tab=batch" class="btn-nav">⚡ Batch</a>
                <a href="/?tab=tracker" class="btn-nav">📋 Tracker</a>
                <a href="/?tab=prep" class="btn-nav">🎓 Interview Prep</a>
            </div>
        </div>
    </div>
</body>
</html>
